@if (suppliersResource.isLoading()) {
  <app-loading-spinner-content></app-loading-spinner-content>
} @else if (suppliersResource.error()) {
  <div>{{ 'ERROR' | translate }}</div>
} @else {
  <div class="app-page-wrapper">
    <div class="app-content-wrapper">
      <div class="accommodation-page-container">
        @if (suppliers().length > 0) {
          @for (supplier of suppliers(); track supplier.id) {
            <div>
              <app-supplier-item [supplier]="supplier"></app-supplier-item>
            </div>
          }
        } @else {
          <app-no-results></app-no-results>
        }
      </div>
    </div>
  </div>
}
